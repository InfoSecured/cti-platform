<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTI Platform</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Stable, top-level Settings view to avoid remount on each keystroke
    function SettingsView({
      darkMode,
      currentScheme,
      orgName,
      setOrgName,
      logoUrl,
      handleLogoUpload,
      colorScheme,
      setColorScheme,
      colorSchemes
    }) {
      return (
        <div className="space-y-6">
          <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
            <h2 className="text-2xl font-bold mb-6">Platform Settings</h2>
            
            <div className="space-y-6">
              <div>
                <label className="block text-sm font-medium mb-2">Organization Name</label>
                <input
                  type="text"
                  value={orgName}
                  onChange={(e) => setOrgName(e.target.value)}
                  className={`w-full px-4 py-2 rounded-lg border ${
                    darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'
                  } focus:outline-none focus:ring-2`}
                  placeholder="Enter organization name"
                  autoFocus
                />
              </div>

              <div>
                <label className="block text-sm font-medium mb-2">Organization Logo</label>
                <div className="flex items-center gap-4">
                  {logoUrl && (
                    <img src={logoUrl} alt="Logo" className="h-16 w-16 object-contain rounded" />
                  )}
                  <label className={`cursor-pointer bg-gradient-to-r ${currentScheme.primary} text-white px-4 py-2 rounded-lg ${currentScheme.hover} flex items-center gap-2`}>
                    <UploadIcon />
                    Upload Logo
                    <input type="file" onChange={handleLogoUpload} className="hidden" accept="image/*" />
                  </label>
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium mb-2">Color Scheme</label>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {Object.entries(colorSchemes).map(([key, scheme]) => (
                    <button
                      key={key}
                      onClick={() => setColorScheme(key)}
                      className={`p-4 rounded-lg border-2 ${
                        colorScheme === key ? scheme.border : 'border-transparent'
                      } ${darkMode ? 'bg-gray-700' : 'bg-gray-100'}`}
                    >
                      <div className={`h-8 rounded bg-gradient-to-r ${scheme.primary} mb-2`}></div>
                      <p className="text-sm capitalize">{key.replace('-', ' ')}</p>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium mb-2">Integrations</label>
                <div className="space-y-3">
                  {['Crowdstrike Falcon', 'VirusTotal', 'MISP', 'OpenCTI', 'Splunk', 'Elastic Security'].map((integration) => (
                    <div key={integration} className={`p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-gray-100'} flex items-center justify-between`}>
                      <div className="flex items-center gap-3">
                        <svg className={`w-5 h-5 ${currentScheme.text}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <span>{integration}</span>
                      </div>
                      <label className="relative inline-block w-12 h-6">
                        <input type="checkbox" className="sr-only peer" defaultChecked />
                        <div className={`w-12 h-6 bg-gray-600 rounded-full peer peer-checked:bg-green-500 transition-colors`}></div>
                        <div className="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-6"></div>
                      </label>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const CTIPlatform = () => {
      const [darkMode, setDarkMode] = useState(true);
      const [currentView, setCurrentView] = useState('dashboard');
      const [colorScheme, setColorScheme] = useState('cyber-red');
      const [orgName, setOrgName] = useState('Your Organization');
      const [logoUrl, setLogoUrl] = useState('');
      const [showSettings, setShowSettings] = useState(false);

      // Color schemes
      const colorSchemes = {
        'cyber-red': {
          primary: 'from-red-600 to-orange-600',
          accent: 'bg-red-500',
          hover: 'hover:bg-red-600',
          text: 'text-red-500',
          border: 'border-red-500'
        },
        'security-blue': {
          primary: 'from-blue-600 to-cyan-600',
          accent: 'bg-blue-500',
          hover: 'hover:bg-blue-600',
          text: 'text-blue-500',
          border: 'border-blue-500'
        },
        'tactical-purple': {
          primary: 'from-purple-600 to-pink-600',
          accent: 'bg-purple-500',
          hover: 'hover:bg-purple-600',
          text: 'text-purple-500',
          border: 'border-purple-500'
        },
        'defense-green': {
          primary: 'from-green-600 to-emerald-600',
          accent: 'bg-green-500',
          hover: 'hover:bg-green-600',
          text: 'text-green-500',
          border: 'border-green-500'
        }
      };

      const currentScheme = colorSchemes[colorScheme];

      // Live data state (replace via fetch calls as you wire APIs)
      const [iocs, setIocs] = useState([]);
      const [threatActors, setThreatActors] = useState([]);
      const [incidents, setIncidents] = useState([]);

      // IOC UI state
      const [isLoadingIocs, setIsLoadingIocs] = useState(false);
      const [iocSearchValue, setIocSearchValue] = useState("");

      // Example: load data from your Worker APIs
      // useEffect(() => {
      //   (async () => {
      //     try {
      //       const [incRes, iocRes, actorRes] = await Promise.all([
      //         fetch('/api/incidents'),
      //         fetch('/api/iocs'),
      //         fetch('/api/actors')
      //       ]);
      //       const [incData, iocData, actorData] = await Promise.all([
      //         incRes.ok ? incRes.json() : [],
      //         iocRes.ok ? iocRes.json() : [],
      //         actorRes.ok ? actorRes.json() : []
      //       ]);
      //       setIncidents(Array.isArray(incData) ? incData : []);
      //       setIocs(Array.isArray(iocData) ? iocData : []);
      //       setThreatActors(Array.isArray(actorData) ? actorData : []);
      //     } catch (fetchError) {
      //       console.error('Failed to load CTI data:', fetchError);
      //     }
      //   })();
      // }, []);

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setLogoUrl(event.target.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // ------- API helpers -------
      async function fetchIocList(limit = 100, offset = 0, typeFilter = "") {
        try {
          setIsLoadingIocs(true);
          const parameters = new URLSearchParams();
          parameters.set("limit", String(limit));
          parameters.set("offset", String(offset));
          if (typeFilter) parameters.set("type", String(typeFilter));

          const response = await fetch(`/api/ioc/list?${parameters.toString()}`);
          const payload = await response.json();
          const list = Array.isArray(payload?.iocs) ? payload.iocs : [];
          setIocs(list);
        } catch (fetchError) {
          console.error("Failed to load IOCs:", fetchError);
        } finally {
          setIsLoadingIocs(false);
        }
      }

      async function handleEnrich(indicatorValue, optionalType) {
        try {
          const trimmed = String(indicatorValue || "").trim();
          if (trimmed.length === 0) return;

          const parameters = new URLSearchParams();
          parameters.set("source", "crowdstrike");
          parameters.set("value", trimmed);
          if (optionalType) parameters.set("type", String(optionalType));

          const response = await fetch(`/api/enrich?${parameters.toString()}`);
          const payload = await response.json();

          if (!response.ok) {
            console.error("Enrich failed:", payload?.error || "unknown error");
            return;
          }

          // Refresh list so the newly enriched IOC appears
          await fetchIocList();
        } catch (enrichError) {
          console.error("Error enriching IOC:", enrichError);
        }
      }

      // Load initial IOC list on mount
      useEffect(() => {
        fetchIocList().catch((mountError) => console.error("Initial IOC load failed:", mountError));
      }, []);

      // SVG Icons as components
      const ShieldIcon = () => (
        <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      );

      const SearchIcon = () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      );

      const AlertIcon = () => (
        <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      );

      const ActivityIcon = () => (
        <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      );

      const DatabaseIcon = () => (
        <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
        </svg>
      );

      const UsersIcon = () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      );

      const FileTextIcon = () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
      );

      const SettingsIcon = () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      );

      const MoonIcon = () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      );

      const SunIcon = () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/><path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      );

      const UploadIcon = () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      );

      const TrendingUpIcon = () => (
        <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
          <polyline points="17 6 23 6 23 12"/>
        </svg>
      );

      const MapPinIcon = () => (
        <svg className="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      );

      const ZapIcon = () => (
        <svg className="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      );

      const DashboardView = () => (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <div className="flex items-center justify-between">
                <div>
                  <p className={`${darkMode ? 'text-gray-400' : 'text-gray-600'} text-sm`}>Active Threats</p>
                  <p className="text-3xl font-bold mt-2">0</p>
                </div>
                <div className="text-red-500"><AlertIcon /></div>
              </div>
            </div>
            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <div className="flex items-center justify-between">
                <div>
                  <p className={`${darkMode ? 'text-gray-400' : 'text-gray-600'} text-sm`}>IOCs Today</p>
                  <p className="text-3xl font-bold mt-2">{iocs.length}</p>
                </div>
                <div className="text-blue-500"><DatabaseIcon /></div>
              </div>
            </div>
            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <div className="flex items-center justify-between">
                <div>
                  <p className={`${darkMode ? 'text-gray-400' : 'text-gray-600'} text-sm`}>Active Incidents</p>
                  <p className="text-3xl font-bold mt-2">{incidents.length}</p>
                </div>
                <div className="text-orange-500"><ActivityIcon /></div>
              </div>
            </div>
            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <div className="flex items-center justify-between">
                <div>
                  <p className={`${darkMode ? 'text-gray-400' : 'text-gray-600'} text-sm`}>Detections</p>
                  <p className="text-3xl font-bold mt-2">0</p>
                </div>
                <div className="text-green-500"><TrendingUpIcon /></div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <h3 className="text-lg font-semibold mb-4">MITRE ATT&CK Heat Map</h3>
              <div className="grid grid-cols-5 gap-2">
                {[...Array(25)].map((_, index) => (
                  <div
                    key={index}
                    className={`h-12 rounded ${
                      index % 5 === 0 ? 'bg-red-500' : index % 3 === 0 ? 'bg-orange-500' : index % 2 === 0 ? 'bg-yellow-500' : 'bg-gray-600'
                    } opacity-${Math.floor(Math.random() * 5) + 3}0`}
                  />
                ))}
              </div>
            </div>

            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <h3 className="text-lg font-semibold mb-4">Recent Activity</h3>
              <div className="space-y-3">
                {incidents.length === 0 && (
                  <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>No incidents yet.</p>
                )}
                {incidents.map((incident) => (
                  <div key={incident.id} className={`p-3 rounded ${darkMode ? 'bg-gray-700' : 'bg-gray-50'}`}>
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="font-medium">{incident.title}</p>
                        <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>{incident.id}</p>
                      </div>
                      <span className={`px-2 py-1 rounded text-xs font-semibold ${
                        incident.severity === 'Critical' ? 'bg-red-500' :
                        incident.severity === 'High' ? 'bg-orange-500' : 'bg-yellow-500'
                      }`}>
                        {incident.severity}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
            <h3 className="text-lg font-semibold mb-4">Geographic Threat Distribution</h3>
            <div className="flex items-center justify-center h-64 bg-gradient-to-br from-gray-700 to-gray-900 rounded-lg">
              <div className="text-red-500"><MapPinIcon /></div>
              <p className={`ml-4 ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Interactive map visualization</p>
            </div>
          </div>
        </div>
      );

      function IOCView({
        darkMode,
        currentScheme,
        iocs,
        isLoadingIocs,
        iocSearchValue,
        setIocSearchValue,
        handleEnrich
      }) {
        return (
          <div className="space-y-6">
            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <div className="flex items-center gap-4 mb-6">
                <div className="flex-1">
                  <input
                    type="text"
                    value={iocSearchValue}
                    onChange={(event) => setIocSearchValue(event.target.value)}
                    placeholder="Search or enrich IOCs (IP, domain, hash, URL)..."
                    className={`w-full px-4 py-3 rounded-lg border ${
                      darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'
                    } focus:outline-none focus:ring-2`}
                    autoFocus
                  />
                </div>
                <button
                  onClick={() => handleEnrich(iocSearchValue)}
                  className={`bg-gradient-to-r ${currentScheme.primary} text-white px-6 py-3 rounded-lg ${currentScheme.hover} transition-colors flex items-center gap-2`}
                >
                  <SearchIcon />
                  Enrich
                </button>
              </div>

              <div className="flex gap-4 mb-6">
                <button className={`px-4 py-2 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-gray-100'}`}>All Types</button>
                <button className={`px-4 py-2 rounded-lg ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-100 hover:bg-gray-200'}`}>IPs</button>
                <button className={`px-4 py-2 rounded-lg ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-100 hover:bg-gray-200'}`}>Domains</button>
                <button className={`px-4 py-2 rounded-lg ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-100 hover:bg-gray-200'}`}>Hashes</button>
                <button className={`px-4 py-2 rounded-lg ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-100 hover:bg-gray-200'}`}>URLs</button>
              </div>
            </div>

            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'} overflow-hidden`}>
              <table className="w-full">
                <thead className={`${darkMode ? 'bg-gray-700' : 'bg-gray-50'}`}>
                  <tr>
                    <th className="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Type</th>
                    <th className="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Indicator</th>
                    <th className="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Threat Level</th>
                    <th className="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Source</th>
                    <th className="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Detections</th>
                    <th className="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-700">
                  {isLoadingIocs && (
                    <tr>
                      <td colSpan="6" className="px-6 py-6 text-center text-sm">
                        Loading IOCs...
                      </td>
                    </tr>
                  )}
                  {iocs.length === 0 ? (
                    <tr>
                      <td colSpan="6" className="px-6 py-8 text-center text-sm">
                        {darkMode ? 'No IOCs found yet.' : 'No IOCs found yet.'}
                      </td>
                    </tr>
                  ) : (
                    iocs.map((ioc, rowIndex) => (
                      <tr key={rowIndex} className={`${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                        <td className="px-6 py-4 whitespace-nowrap">
                          <span className={`px-2 py-1 rounded text-xs font-semibold ${darkMode ? 'bg-gray-600' : 'bg-gray-200'}`}>
                            {ioc.type}
                          </span>
                        </td>
                        <td className="px-6 py-4 font-mono text-sm">{ioc.value}</td>
                        <td className="px-6 py-4 whitespace-nowrap">
                          <span className={`px-2 py-1 rounded text-xs font-semibold ${
                            ioc.threat === 'Critical' ? 'bg-red-500' :
                            ioc.threat === 'High' ? 'bg-orange-500' : 'bg-yellow-500'
                          }`}>
                            {ioc.threat}
                          </span>
                        </td>
                        <td className="px-6 py-4">{ioc.source}</td>
                        <td className="px-6 py-4">{ioc.detections ?? 0}</td>
                        <td className="px-6 py-4">
                          <button onClick={() => handleEnrich(ioc.value, ioc.type)} className={`${currentScheme.text} hover:underline text-sm`}>Enrich</button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>

            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
              <h3 className="text-lg font-semibold mb-4">Integration Status</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {['Crowdstrike', 'VirusTotal', 'AbuseIPDB', 'Shodan', 'MISP', 'OpenCTI', 'GreyNoise', 'AlienVault'].map((service) => (
                  <div key={service} className={`p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-gray-50'} flex items-center justify-between`}>
                    <span>{service}</span>
                    <div className="w-3 h-3 bg-green-500 rounded-full"></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      const ThreatActorsView = () => (
        <div className="space-y-6">
          <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-6 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
            <h2 className="text-2xl font-bold mb-6">Known Threat Actors</h2>
            <div className="space-y-4">
              {threatActors.length === 0 && (
                <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>No threat actors loaded yet.</p>
              )}
              {threatActors.map((actor) => (
                <div key={actor.name} className={`p-6 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-gray-50'} border ${darkMode ? 'border-gray-600' : 'border-gray-200'}`}>
                  <div className="flex items-start justify-between">
                    <div className="flex-1">
                      <h3 className="text-xl font-bold">{actor.name}</h3>
                      <p className={`${darkMode ? 'text-gray-400' : 'text-gray-600'} mt-1`}>AKA: {actor.aka}</p>
                      <div className="flex gap-4 mt-4">
                        <div>
                          <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Status</p>
                          <p className="font-semibold text-red-500">{actor.activity}</p>
                        </div>
                        <div>
                          <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Primary Targets</p>
                          <p className="font-semibold">{actor.targets}</p>
                        </div>
                      </div>
                    </div>
                    <button className={`bg-gradient-to-r ${currentScheme.primary} text-white px-4 py-2 rounded-lg ${currentScheme.hover}`}>
                      View Profile
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );


      return (
        <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-900'}`}>
          {/* Header */}
          <header className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border-b sticky top-0 z-50`}>
            <div className="max-w-7xl mx-auto px-6 py-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-4">
                  {logoUrl ? (
                    <img src={logoUrl} alt="Logo" className="h-10 w-auto" />
                  ) : (
                    <div className={currentScheme.text}><ShieldIcon /></div>
                  )}
                  <div>
                    <h1 className="text-xl font-bold">{orgName}</h1>
                    <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Threat Intelligence Platform</p>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    className={`p-2 rounded-lg ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-100 hover:bg-gray-200'}`}
                  >
                    {darkMode ? <SunIcon /> : <MoonIcon />}
                  </button>
                  <button
                    onClick={() => setShowSettings(!showSettings)}
                    className={`p-2 rounded-lg ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-100 hover:bg-gray-200'}`}
                  >
                    <SettingsIcon />
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Navigation */}
          <nav className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border-b`}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="flex gap-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: ActivityIcon },
                  { id: 'iocs', label: 'IOC Management', icon: DatabaseIcon },
                  { id: 'actors', label: 'Threat Actors', icon: UsersIcon },
                  { id: 'incidents', label: 'Incidents', icon: AlertIcon },
                  { id: 'reports', label: 'Reports', icon: FileTextIcon },
                ].map(({ id, label, icon: Icon }) => (
                  <button
                    key={id}
                    onClick={() => {
                      setCurrentView(id);
                      setShowSettings(false);
                    }}
                    className={`flex items-center gap-2 px-4 py-3 border-b-2 transition-colors ${
                      currentView === id
                        ? `${currentScheme.border} ${currentScheme.text}`
                        : `border-transparent ${darkMode ? 'text-gray-400 hover:text-white' : 'text-gray-600 hover:text-gray-900'}`
                    }`}
                  >
                    <Icon />
                    {label}
                  </button>
                ))}
              </div>
            </div>
          </nav>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-6 py-8">
            {showSettings ? (
              <SettingsView
                darkMode={darkMode}
                currentScheme={currentScheme}
                orgName={orgName}
                setOrgName={setOrgName}
                logoUrl={logoUrl}
                handleLogoUpload={handleLogoUpload}
                colorScheme={colorScheme}
                setColorScheme={setColorScheme}
                colorSchemes={colorSchemes}
              />
            ) : currentView === 'dashboard' ? (
              <DashboardView />
            ) : currentView === 'iocs' ? (
              <IOCView
                darkMode={darkMode}
                currentScheme={currentScheme}
                iocs={iocs}
                isLoadingIocs={isLoadingIocs}
                iocSearchValue={iocSearchValue}
                setIocSearchValue={setIocSearchValue}
                handleEnrich={handleEnrich}
              />
            ) : currentView === 'actors' ? (
              <ThreatActorsView />
            ) : (
              <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} p-12 rounded-lg border ${darkMode ? 'border-gray-700' : 'border-gray-200'} text-center`}>
                <div className={`${currentScheme.text} mx-auto mb-4`}><ZapIcon /></div>
                <h2 className="text-2xl font-bold mb-2">{currentView.charAt(0).toUpperCase() + currentView.slice(1)} View</h2>
                <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>This section is under development</p>
              </div>
            )}
          </main>
        </div>
      );
    };

    ReactDOM.render(<CTIPlatform />, document.getElementById('root'));
  </script>
</body>
</html>
